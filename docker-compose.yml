services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: siperkasa
      POSTGRES_USER: siperkasa
      POSTGRES_PASSWORD: siperkasa_password
    volumes:
      - siperkasa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siperkasa -d siperkasa"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  siperkasa_pgdata:
